services:
  - type: web
    name: q-not
    runtime: node
    plan: free
    region: ohio
    repo: https://github.com/Vicgrace01/q-not
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --global pnpm@12.3.4 && pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm exec prisma migrate deploy && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

